services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spur
      POSTGRES_USER: spur
      POSTGRES_PASSWORD: spur
    volumes:
      - spur-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spur -d spur"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: cli
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://spur:spur@postgres:5432/spur
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  spur:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://spur:spur@postgres:5432/spur
      SPUR_AUTH: none
      # The demo organisation on the bundled fixture repository.
      SPUR_ORGANIZATION_SLUG: demo
      SPUR_ORGANIZATION_NAME: Demo organisation
      SPUR_REPOSITORY_ROOT: /repository
      SPUR_SYNTHESIS_PROVIDER: none
    volumes:
      - ./fixture-repo:/repository:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped

volumes:
  spur-postgres:
