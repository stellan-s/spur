# Builds the Spur image, runs the migrations and deploys to Cloud Run.
# A trigger on the main branch runs it on every push. By hand, from the repo root:
#   gcloud builds submit --config=cloudbuild.yaml --substitutions=_REPOSITORY=my-registry,_TAG=$(git rev-parse --short HEAD) .
# Before the first `./deploy/gcp/apply.sh` the service and job do not exist yet,
# so the build only pushes the image and skips the deploy steps.
steps:
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Check image in Artifact Registry"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [ -z "${_REPOSITORY}" ] || [ -z "${_TAG}" ]; then
          echo "Pass --substitutions=_REPOSITORY=...,_TAG=..." >&2
          exit 1
        fi
        if gcloud container images list-tags ${_IMAGE} --filter=tags=${_TAG} --format="value(tags)" 2>/dev/null | grep -qw ${_TAG}; then
          echo "Image ${_TAG} already exists. Will not build again."
          echo "_IMAGE_EXISTS=True" > status.env
        else
          echo "_IMAGE_EXISTS=False" > status.env
        fi

  - name: "gcr.io/cloud-builders/docker"
    id: "Build and push image"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        source status.env
        if [ "$$_IMAGE_EXISTS" = "True" ]; then
          echo "Skipping build."
          exit 0
        fi
        docker pull ${_IMAGE}:latest || true
        DOCKER_BUILDKIT=1 docker build -t ${_IMAGE}:${_TAG} \
          --cache-from ${_IMAGE}:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 .
        # Push only the tags built here, never --all-tags.
        docker tag ${_IMAGE}:${_TAG} ${_IMAGE}:latest
        docker push ${_IMAGE}:${_TAG}
        docker push ${_IMAGE}:latest

  - name: "gcr.io/cloud-builders/gcloud"
    id: "Run migrations"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if ! gcloud run jobs describe ${_SERVICE}-migrate --region=${_REGION} >/dev/null 2>&1; then
          echo "Migration job does not exist yet. Run ./deploy/gcp/apply.sh first."
          exit 0
        fi
        gcloud run jobs update ${_SERVICE}-migrate --region=${_REGION} --image=${_IMAGE}:${_TAG}
        gcloud run jobs execute ${_SERVICE}-migrate --region=${_REGION} --wait

  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy to Cloud Run"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if ! gcloud run services describe ${_SERVICE} --region=${_REGION} >/dev/null 2>&1; then
          echo "Service does not exist yet. Run ./deploy/gcp/apply.sh first."
          exit 0
        fi
        gcloud run services update ${_SERVICE} --region=${_REGION} --image=${_IMAGE}:${_TAG}

substitutions:
  _SERVICE: spur
  _REGION: europe-north1
  # The project's Artifact Registry Docker repository. Required.
  _REPOSITORY: ""
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}
  # Triggers fill SHORT_SHA; manual builds pass _TAG.
  _TAG: ${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
