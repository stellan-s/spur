name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spur_test
          POSTGRES_USER: spur
          POSTGRES_PASSWORD: spur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spur"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://spur:spur@localhost:5432/spur_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The fixture repository is created with git commits.
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: docker build --target runner .
